line-length = 88
# The checkers run under the uv-pinned interpreter (see PYTHON_VERSION in the
# Makefile), but these scripts are executed by each host's `#!/usr/bin/env
# python3`. Keep the emitted syntax at 3.13 so a 3.14-only rewrite (e.g. PEP 758
# unparenthesized `except A, B:`) can't turn a linter bump into a runtime
# SyntaxError on a machine that hasn't caught up.
target-version = "py313"
extend-exclude = [
  "yazi/.config/yazi/flavors",
]

[lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "UP",
  "SIM",
  "I",
  "C4",
  "PIE",
  "RUF",
  "PERF",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false
