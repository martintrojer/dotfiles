# CLI tools shared by Linux and macOS. `dotfiles-sync --apply` links this as
# the global mise config, and each OS package adds its own extras in
# conf.d/ (mise-linux, mise-macos). `mise/setup-mise.sh` installs the lot.
# Mac GUI apps and Mac-only formulae stay in homebrew/.Brewfile.
min_version = "2026.6.14"

# Keep `npm i -g` out of the node install dir. mise's default prefix is per
# version (installs/node/24.21.0/...), so every node bump, even a patch, starts
# with an empty global set. ~/.local/bin is already on PATH (zshenv, and
# environment.d for the graphical session).
[env]
NPM_CONFIG_PREFIX = "{{env.HOME}}/.local"

[tools]
bat = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gdu = "latest"
gh = "latest"
"github:LuaLS/lua-language-server" = "latest"
"github:martintrojer/debrief" = "latest"
"github:martintrojer/mdroots" = "latest"
"github:martintrojer/ramble" = "latest"
"github:tekumara/typos-lsp" = "latest"
go = "latest"
# Under evaluation as a tmux alternative; daily home is still tmux.
# See herdr/README.md and docs/DECISIONS.md § Agent state awareness.
herdr = "latest"
jj = "latest"
# Pinned to 5.4, not latest: luacheck 1.2.0 (the `make check-lua` rock) assigns
# to a for-loop variable, which Lua 5.5 made const, so it dies on load.
lua = "5.4"
neovim = "latest"
# Pinned to a major, not latest: global npm installs live in ~/.local (see
# [env]) and survive bumps, but native addons can break on a new major's ABI.
node = "26"
# prettier/stylua (and shellcheck, in conf.d/linux.toml) are here for editor format-on-save and ad-hoc CLI
# use. The repo's `make check-*` gate does not use them: it pins its own
# versions and runs them via uvx/npx (see docs/SETUP.md).
prettier = "latest"
ripgrep = "latest"
rust = "latest"
rust-analyzer = "latest"
stylua = "latest"
# TOML LSP for nvim.
taplo = "latest"
# Terminal multiplexer with repo-managed config.
tmux = "latest"
tokei = "latest"
tree-sitter = "latest"
uv = "latest"
vale = "latest"
yazi = "latest"
zoxide = "latest"
