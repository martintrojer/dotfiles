# zram swap. See zram-generator.conf(5).
#
# Overrides /usr/lib/systemd/zram-generator.conf from zram-generator-defaults,
# whose stock min(ram, 8192) is sized for small machines.

[zram0]
# Virtual (uncompressed) capacity of the swap device. zstd on a normal
# desktop working set lands around 3:1, so a 1:1-with-RAM disksize is
# reachable without ever approaching the resident limit below.
zram-size = ram

# The knob that actually bounds RAM cost: hard cap on the *compressed*
# footprint held in memory (/sys/block/zram0/mem_limit). Without it, a
# pathological incompressible workload could grow zram until the machine
# has no anonymous memory left to reclaim into. Half of RAM leaves the
# other half for real pages even in the worst case.
zram-resident-limit = ram / 2

# zstd beats the kernel default (lzo-rle) on ratio at a latency that is
# still far below any SSD. For a lower-latency / lower-ratio tradeoff use
# `zstd(level=1)`; for lz4-speed with zstd recompression of idle pages,
# `lz4 zstd` — but recompression only happens when something writes to
# /sys/block/zram0/recompress, which nothing here does.
compression-algorithm = zstd

# No writeback-device: incompressible pages stay in RAM rather than being
# pushed to the NVMe. Deliberate — this host has no disk swap at all, and
# adding one would put write amplification back on the SSD.
