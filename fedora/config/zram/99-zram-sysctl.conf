# VM tuning for swap-on-zram. See sysctl(8), Documentation/admin-guide/sysctl/vm.rst.
#
# The kernel defaults assume swap is a spinning disk or SSD: expensive per
# fault, so avoid it and read ahead when you must. zram inverts both
# assumptions -- a fault is a memcpy plus a decompress, and there is no seek
# to amortise.

# Prefer reclaiming anonymous pages (into zram) over evicting page cache.
# 180 is the value the kernel documents for the zram case: it makes
# anon reclaim cheaper than file reclaim, which is true when "swap" is RAM.
vm.swappiness = 180

# Fault in one page at a time. The default of 3 means 2^3 = 8 pages per
# fault, so 32K decompressed to use 4K -- readahead that only pays off
# when a seek dominates the transfer. It never does on zram.
vm.page-cluster = 0

# Wake kswapd earlier and let it work further ahead of allocation, so
# compression happens in the background instead of in a direct-reclaim
# stall on an allocating thread. 125 => watermark gaps of ~1.25% of a zone.
vm.watermark_scale_factor = 125

# Disable watermark boosting. It exists to reclaim extra for external
# fragmentation / THP availability, but paired with high swappiness it
# evicts far more than needed in bursts. Fedora ships 15000.
vm.watermark_boost_factor = 0
