# /tmp on disk: bind-mount /var/tmp over it instead of a RAM-backed tmpfs.
#
# Fedora's tmpfs /tmp costs RAM per byte, and under pressure spills into
# zram, which is RAM too. Agents park worktrees and cargo target/ dirs in
# /tmp, so a 16G (or capped 4G) tmpfs either eats memory or hits ENOSPC.
# The root is a read-only composefs, so masking tmp.mount would leave /tmp
# read-only, and a /tmp -> /var/tmp symlink can only live in the image.
# Overriding What= keeps tmp.mount's ordering and RequiresMountsFor=/var/tmp.
#
# Same approach as Fedora Atomic's cloud images (coreos/rpm-ostree#820) and
# ericcurtin/agenticlinux#27. nosuid,nodev are what the tmpfs had.
[Mount]
What=/var/tmp
Type=none
Options=bind,nosuid,nodev
