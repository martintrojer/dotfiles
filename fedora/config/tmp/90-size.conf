# /tmp is a RAM-backed tmpfs. Fedora sizes it at 50% of RAM (16G here),
# which lets a few agents' worktrees and cargo target/ dirs eat half the
# machine's memory before anything fails. Cap it at 4G so a runaway writer
# hits ENOSPC early instead. Big scratch belongs in /var/tmp (disk).
#
# Options= replaces the stock line wholesale, so this repeats every stock
# option from /usr/lib/systemd/system/tmp.mount and changes only size=.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,size=4G,nr_inodes=1m,x-systemd.graceful-option=usrquota
