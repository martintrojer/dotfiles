# Fedora userland tools. `fedora/setup-mise.sh` installs this manifest;
# `dotfiles-sync --apply` stows it as the global mise config.
min_version = "2026.6.14"

[tools]
bat = "latest"
btop = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gdu = "latest"
gh = "latest"
"github:LuaLS/lua-language-server" = "latest"
"github:pythops/bluetui" = "latest"
"github:rgwood/systemctl-tui" = "latest"
"github:tekumara/typos-lsp" = "latest"
"github:zk-org/zk" = "latest"
glow = "latest"
go = "latest"
imagemagick = "latest"
jj = "latest"
just = "latest"
lazygit = "latest"
lua = "latest"
marp-cli = "latest"
neovim = "latest"
# Pinned to a major, not latest: pi and other Node tooling are installed into
# this runtime, and a major bump silently orphans their global installs.
node = "24"
prettier = "latest"
rclone = "latest"
ripgrep = "latest"
rust = "latest"
rust-analyzer = "latest"
shellcheck = "latest"
stylua = "latest"
tokei = "latest"
tree-sitter = "latest"
uv = "latest"
vale = "latest"
yazi = "latest"
zoxide = "latest"
