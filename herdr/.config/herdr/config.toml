# herdr — terminal workspace manager for coding agents.
#
# Evaluation package only. Daily multiplexer is tmux; stack decision in
# docs/DECISIONS.md § Agent state awareness (tmux + murmur + mu + coop).
# See herdr/README.md. Only settings that differ from the herdr default
# are written here — run `herdr --default-config` to see the full annotated
# set.
#
# Keybindings stay on stock herdr so the eval tests herdr's own model,
# not a tmux dialect. Learn them with prefix+? inside herdr.

onboarding = false

[update]
# mise owns the herdr binary (fedora/mise/.config/mise/config.toml).
# Self-update would fight it and leave two copies on $PATH.
version_check = false
manifest_check = false

# Additive only: stock leaves these unset. The agent panel is the picker
# surface; with agent_panel_sort = "priority", row 1 is most urgent.
[keys]
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

[ui]
# Collapsed to the narrow "compact" rail rather than hidden outright, with
# prefix+b to expand on demand. herdr cannot move the panel to a horizontal
# strip on top — sidebar position is not configurable — so the rail is the
# smallest permanent footprint on offer (docs/DECISIONS.md).
sidebar_start_collapsed = true

# Attention queue, not space order — what the eval is actually testing.
agent_panel_sort = "priority"

# Agent label on the border so a split pane says what is in it without
# expanding the sidebar.
show_agent_labels_on_pane_borders = true

# Adjacent panes share one divider instead of each drawing its own border.
pane_gaps = false

# Reclaim the scrollbar column; mouse wheel still scrolls.
pane_scrollbars = false

[ui.toast]
delivery = "herdr"

[ui.sound]
# Toasts are enough. Sound would need a per-OS audio backend, and this
# package is common scope.
enabled = false
