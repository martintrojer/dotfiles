# -----------------------------------------------------------------------------
# Terminal and protocol features
# -----------------------------------------------------------------------------

# Standard tmux terminal inside the session.
set-option -g default-terminal "tmux-256color"

# Modern RGB + undercurl per outer terminal. Explicit indices keep reloads
# idempotent (`set -as` would append duplicates on every prefix+R). tmux's
# compiled defaults sit at 0..2; we use 10..11 to leave headroom.
# `xterm*` covers xterm-256color and xterm-ghostty; `foot*` (TERM=foot /
# foot-extra) doesn't match the glob, so it gets its own line.
set -g terminal-features[10] "xterm*:RGB:usstyle:hyperlinks"
set -g terminal-features[11] "foot*:RGB:usstyle:hyperlinks"

# Window titles shown to the outer terminal (foot/ghostty title bar,
# sway window title for floats, etc.). Reuses the same smart label that
# powers the tmux status line via @win_label so the outer title matches
# what's actually running in the active pane (e.g. "dotfiles · nvim")
# rather than the literal window index or shell name.
set-option -g set-titles on
set-option -g set-titles-string "#S · #{T:@win_label}"


# -----------------------------------------------------------------------------
# Core behavior
# -----------------------------------------------------------------------------

set -g prefix ^B
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1        # start indexing panes at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 10000       # increase history size (from 2,000); kept moderate to limit grid memory (tmux #4777 copy-mode crash)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g allow-passthrough on      # allow OSC52 to pass through to outer terminal
set -g focus-events on           # let programs detect pane focus changes
set -g mouse on                  # enable mouse (click panes/windows, resize, scroll)
set -g extended-keys on          # xterm-style extended key reporting (CSI u)
set -g extended-keys-format csi-u # use CSI u format for extended keys
set -g repeat-time 1000          # 1s window for repeatable bindings
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
setw -g aggressive-resize on     # resize based on active client, not smallest


# -----------------------------------------------------------------------------
# Theme palette
# -----------------------------------------------------------------------------

# Catppuccin Mocha palette used directly (no theme plugin).
# Tmux uses a dark block + warm accent text look so it visually breaks away
# from the nvim tabline right below it.
# THEME BEGIN: tmux-palette
set -g @color_sky '#89dceb'
set -g @color_lavender '#b4befe'
# Pane border accent. Mauve so it stands distinct from @color_lavender,
# which we use for status-bar window-current highlights.
set -g @color_border '#cba6f7'
set -g @color_peach '#fab387'
set -g @color_red '#f38ba8'
set -g @color_yellow '#f9e2af'
set -g @color_text '#cdd6f4'
set -g @color_subtext0 '#a6adc8'
set -g @color_overlay0 '#6c7086'
set -g @color_surface0 '#313244'
set -g @color_surface1 '#45475a'
set -g @color_surface2 '#585b70'
set -g @color_base '#1e1e2e'
set -g @color_crust '#11111b'

# Chrome glyphs, from docs/glyphs.toml. .tmux.conf cannot read TOML, so the
# vocabulary reaches it as user options and each segment interpolates
# `#{@glyph_*}` instead of spelling a codepoint: a glyph typed into a format
# string is invisible to `make check-theme`, one read from an option is not.
# They ride in this region rather than one of their own so the whole file
# stays a single registered pair.
#
# Safe inside `#{E:...}`: a nested `#{@glyph_x}` resolves during the
# re-expansion, which is what lets @status_hostname and the window-status
# zoom conditional both use one.
set -g @glyph_host '󰒋'
set -g @glyph_cpu ''
set -g @glyph_zoom '󰍉'
set -g @glyph_uptime '󰥔'
# Two RAM glyphs because the platforms report different things: Linux used/total
# (a memory chip), macOS a pressure score (a gauge). @glyph_ram picks one.
set -g @glyph_ram_linux '󰍛'
set -g @glyph_ram_darwin '◔'
# THEME END: tmux-palette

# Hostname pill for status-right. Rendered once by status-hostname (the
# accent color is hashed from the short hostname so every box gets a
# stable, distinct corner color in peripheral vision — same idea as
# VSCode's per-window decorations). The default keeps the muted look if
# the helper script is missing (e.g. before `dotfiles-sync --apply`); the
# run-shell upgrades it to the colored pill at config load.
set -g @status_hostname '#[fg=#{@color_subtext0}]#[bg=#{@color_surface0}] #{@glyph_host} #H #[default]'
run-shell 'script="$HOME/.config/tmux/scripts/status-hostname"; [ -x "$script" ] && pill=$("$script") && [ -n "$pill" ] && tmux set-option -g @status_hostname "$pill"'


# -----------------------------------------------------------------------------
# Tmux UI styles
# -----------------------------------------------------------------------------

set -g pane-active-border-style 'fg=#{@color_border},bg=default,bold'
set -g pane-border-style 'fg=#{@color_overlay0},bg=default'
set -g pane-border-lines heavy
set -g pane-border-indicators both
# pane-border-format (mu's pane title + murmur's pane state) comes from
# mu-crew.conf.
set -g mode-style 'fg=#{@color_crust},bg=#{@color_sky},bold'
set -g message-style 'fg=#{@color_text},bg=#{@color_surface0}'
set -g message-command-style 'fg=#{@color_crust},bg=#{@color_sky},bold'
set -g popup-style 'fg=#{@color_text},bg=#{@color_base}'
set -g popup-border-style 'fg=#{@color_overlay0},bg=#{@color_base}'
set -g menu-style 'fg=#{@color_text},bg=#{@color_base}'
set -g menu-selected-style 'fg=#{@color_crust},bg=#{@color_sky},bold'


# -----------------------------------------------------------------------------
# Session and window navigation
# -----------------------------------------------------------------------------
# prefix s / g / T (session picker, last session, session at pane cwd) come
# from the tsesh plugin below: mu-crew/tmux-session-picker.

bind -N "session tree (sorted)" S choose-tree -sZ -O name
bind -N "reload .tmux.conf" R source-file "$HOME/.tmux.conf" \; display-message "Sourced $HOME/.tmux.conf"
bind -n MouseDown1StatusLeft choose-tree -s  # click session tab to open session picker


# -----------------------------------------------------------------------------
# Pane / window management
# -----------------------------------------------------------------------------

bind -n C-q clear-history

# Vi copy-mode bindings.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Shell-prompt jumping (requires OSC 133 markers from the shell; see zsh/tools.zsh).
bind -T copy-mode-vi M-Up   send -X previous-prompt
bind -T copy-mode-vi M-Down send -X next-prompt

# Splits and new windows inherit current path.
bind -N "split vertical (cwd)" '"' split-window -v -c "#{pane_current_path}"
bind -N "split horizontal (cwd)" % split-window -h -c "#{pane_current_path}"
bind -N "new window (cwd)" c new-window -c "#{pane_current_path}"
bind -N "move pane to picked target" M run-shell "$HOME/.config/tmux/scripts/move-pane-picker '#{pane_id}'"

# Sway-style pane navigation: PREFIX + arrows focus, PREFIX + Shift+arrows move.
# Mirrors sway's $mod+{Left,Down,Up,Right} and $mod+Shift+{...} bindings.
bind -N "focus pane left  (sway-style)" -r Left  select-pane -L
bind -N "focus pane down  (sway-style)" -r Down  select-pane -D
bind -N "focus pane up    (sway-style)" -r Up    select-pane -U
bind -N "focus pane right (sway-style)" -r Right select-pane -R
# swap-pane with the directional neighbor: mark current, focus that way,
# swap-pane against the mark, then clear the mark. Doing it via {left-of}
# etc. is unreliable because those targets only resolve when the command
# runs with an attached client context.
bind -N "swap pane left  (sway-style)" -r S-Left  select-pane -m \; select-pane -L \; swap-pane \; select-pane -M
bind -N "swap pane down  (sway-style)" -r S-Down  select-pane -m \; select-pane -D \; swap-pane \; select-pane -M
bind -N "swap pane up    (sway-style)" -r S-Up    select-pane -m \; select-pane -U \; swap-pane \; select-pane -M
bind -N "swap pane right (sway-style)" -r S-Right select-pane -m \; select-pane -R \; swap-pane \; select-pane -M

# Cycle vertical split width between 1/3, 1/2, and 2/3.
# Mnemonic: 'r' for resize-cycle (matches sway's mod+r preset-width).
bind -N "cycle pane width 1/3 - 1/2 - 2/3" -r r run-shell 'pw=#{pane_width}; ww=#{window_width}; r=$((pw * 100 / ww)); if [ $r -lt 40 ]; then tmux resize-pane -x $((ww / 2)); elif [ $r -lt 60 ]; then tmux resize-pane -x $((ww * 2 / 3)); else tmux resize-pane -x $((ww / 3)); fi'


# -----------------------------------------------------------------------------
# Picker helpers and local scripts
# -----------------------------------------------------------------------------

set-environment -g TMUX_FZF_OPTIONS "-p -w 80% -h 75% -m"

# Clipboard history picker (mirrors sway's mod+v / mod+Shift+c).
bind -N "clipboard history" v run-shell -b "$HOME/.tmux/plugins/tmux-fzf/scripts/clipboard.sh"
bind -N "cheatsheet popup" C-g display-popup -E -w 60% -h 80% "$HOME/.config/tmux/scripts/cheatsheet"

# Tab: pick visible matches (mirrors sway mod+Tab "pick a thing"). Jump mode
# (@fingers-jump-key) is intentionally unset; only paste-back (Shift+hint) is used.
set -g @fingers-key Tab
set -g @fingers-show-copied-notification 1
# Bare ANSI green/blue: foot's [colors-dark] and ghostty's palette both
# map these to Catppuccin Mocha hex, so they render on-theme without a
# palette indirection.
set -g @fingers-hint-style 'fg=green,bold,underscore'
set -g @fingers-selected-hint-style 'fg=blue,bold,underscore'
set -g @fingers-pattern-0 '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
set -g @fingers-pattern-1 '\b[a-zA-Z0-9.-]+:\d{2,5}\b'
set -g @fingers-pattern-2 '\bv?\d+\.\d+\.\d+\b'
set -g @fingers-pattern-3 '\bD\d+\b'
set -g @fingers-pattern-4 '\bT\d+\b'
# Git revs (7-40 hex). Must be a custom pattern_N: those keys sort before all
# builtin names in the combined alternation, so they win leftmost-branch matching.
# Without this the builtin `digit` ([0-9]{4,}) shadows `sha` and truncates a
# numeric-prefixed rev like 799752b762 down to 799752.
set -g @fingers-pattern-5 '\b[0-9a-f]{7,40}\b'


# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'martintrojer/tmux-fingers-rs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
# tsesh: prefix s (picker), g (last session), T (session at pane cwd).
set -g @plugin 'mu-crew/tmux-session-picker'

# Note: plugins are loaded by TPM at the end of the file. Do not run them directly.


# -----------------------------------------------------------------------------
# Status bar layout
# -----------------------------------------------------------------------------

# Native status bar with merged windows and boxed high-signal segments.
# Keep the bar itself on the terminal default background so inactive
# windows and flat right-side segments do not get an extra fill.
set -g status-style 'bg=default,fg=#{@color_text}'

# murmur and the mu-crew poller repaint when their options change, so the
# timer only catches what tmux does not announce: a pane's current command
# or title changing under the window labels.
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 210
set -g status-justify left
set -g window-status-separator '  '
set -g window-status-style 'bg=default'

# Shared active-pane label: murmur's agent name, else an editor's command,
# else a meaningful title (shells: then the cwd basename; anything else: then
# its command). A title is meaningful unless empty, the hostname (the default
# a shell sets), or path-shaped. Word lists are options so a local config can
# extend them without replacing the format.
set -g @win_label_editors '|nvim|vim|vi|hx|helix|kak|emacs|nano|'
set -g @win_label_shells '|zsh|bash|sh|fish|nu|'
set -g @win_label_title '#{?#{||:#{==:#{pane_title},#{host}},#{m:[:/~]*,#{pane_title}}},,#{pane_title}}'
set -g @win_label '#{?#{@murmur_pane_label},#{@murmur_pane_label},#{?#{m:*|#{pane_current_command}|*,#{@win_label_editors}},#{pane_current_command},#{?#{!=:#{E:@win_label_title},},#{E:@win_label_title},#{?#{m:*|#{pane_current_command}|*,#{@win_label_shells}},#{b:pane_current_path},#{?#{pane_current_command},#{pane_current_command},#{b:pane_current_path}}}}}}'

# Spacer between right-side segments. Bumping this changes every gap.
set -g @sep '#[default]  '

# Trailing whitespace is intentional padding before the first window block.
set -g status-left '#[fg=#{@color_sky},bg=#{@color_surface0},bold] #S #[default]   '

# Both window-status lines share mu-crew's @mu_crew_window_glyph and differ
# only in their own colors: tmux propagates the surrounding #[bg=...] into the
# #{E:...} re-expansion, so the chain needs no background of its own. The
# suffix stays visible in mu-* sessions because it is their tab state glyph.
set -g window-status-format '#[fg=#{@color_overlay0}]#[bg=#{@color_surface0}] #I #[fg=#{@color_subtext0}]#[bg=#{@color_surface0}]#{E:@win_label}#{?window_zoomed_flag, #{@glyph_zoom},}#{E:@mu_crew_window_glyph} #[default]'
set -g window-status-current-format '#[fg=#{@color_lavender}]#[bg=#{@color_surface2}]#[bold] #I #{E:@win_label}#{?window_zoomed_flag, #{@glyph_zoom},}#{E:@mu_crew_window_glyph} #[default]'

# CPU / RAM / uptime come from mu-crew's poller (@mu_crew_probes below): one
# background loop writes plain numbers into options, so these segments run no
# process on a redraw. The levels are ours:
#   <75   muted subtext0 on surface0   (no signal)
#   75-89 peach on surface0            (warn: subtle fg shift only)
#   >=90  crust on Catppuccin red      (high: red bg signals trouble)
# RAM on macOS is a memory-pressure score, not used/total; same levels.
set -gF @glyph_ram "#{@glyph_ram_linux}"
if-shell '[ "$(uname -s)" = Darwin ]' 'set -gF @glyph_ram "#{@glyph_ram_darwin}"'
set -g @load_warn 75
set -g @load_high 90
set -g @load_style_high '#[fg=#{@color_crust}]#[bg=#{@color_red}]'
set -g @load_style_warn '#[fg=#{@color_peach}]#[bg=#{@color_surface0}]'
set -g @load_style_low '#[fg=#{@color_subtext0}]#[bg=#{@color_surface0}]'
set -g @seg_cpu '#{?#{e|>=:#{@mu_crew_cpu},#{@load_high}},#{E:@load_style_high},#{?#{e|>=:#{@mu_crew_cpu},#{@load_warn}},#{E:@load_style_warn},#{E:@load_style_low}}} #{@glyph_cpu} #{@mu_crew_cpu_text} #[default]'
set -g @seg_ram '#{?#{e|>=:#{@mu_crew_mem},#{@load_high}},#{E:@load_style_high},#{?#{e|>=:#{@mu_crew_mem},#{@load_warn}},#{E:@load_style_warn},#{E:@load_style_low}}} #{@glyph_ram} #{@mu_crew_mem_text} #[default]'
set -g @seg_uptime '#[fg=#{@color_subtext0}]#[bg=#{@color_surface0}] #{@glyph_uptime} #{@mu_crew_uptime_text} #[default]'

# The agent / PREFIX badges use the same subtle surface as the session block so
# the accents read like outlined boxes instead of fully filled pills. The agent
# pill is mu-crew's @mu_crew_pill: pure format over murmur's @murmur_count_*
# options, so no process runs on a redraw. It colors each state run itself;
# .tmux.conf supplies only the box background and hides it when empty.
# The probe segments gate on the *_text options, not the numbers: tmux reads
# "0" as false, so a 0% reading would drop the segment and shift the bar.
# Each segment paints its own bg/fg with one space of internal padding
# so the colored region (especially the high-state red bg on cpu/ram)
# breathes instead of slamming flush against the segment glyph. The
# trailing #[default] before #{E:@sep} resets all attrs so the next
# segment starts from a clean slate.
set -g status-right '#{?client_prefix,#[fg=#{@color_yellow}]#[bg=#{@color_surface0}]#[bold] PREFIX #[default]#{E:@sep},}#{?#{e|>:#{E:@mu_crew_n_any},0},#[bg=#{@color_surface0}]#{E:@mu_crew_pill}#[default]#{E:@sep},}#{?#{@mu_crew_cpu_text},#{E:@seg_cpu}#{E:@sep},}#{?#{@mu_crew_mem_text},#{E:@seg_ram}#{E:@sep},}#{E:@status_hostname}#{?#{@mu_crew_uptime_text},#{E:@sep}#{E:@seg_uptime},}'


# -----------------------------------------------------------------------------
# mu-crew: mu-crew/dotfiles
# -----------------------------------------------------------------------------

# Focus hooks (murmur clear), keys a (murmur pick), C-m (side panel), G (dash),
# u (mu workstream picker), pane-border-format, and the agent glyph / pill
# formats used above. dotfiles-sync clones it at a pinned ref
# (_dotfiles_sync/pins.py); bump the ref there to move forward. Our colors and
# glyphs override its defaults: generated from docs/palette.toml and
# docs/glyphs.toml.
set -g @mu_crew_probes "murmur_remote memory cpu uptime"
source-file "$HOME/.local/share/mu-crew-dotfiles/tmux/mu-crew.conf"
# THEME BEGIN: tmux-mu-crew-glyphs
# Overrides mu-crew.conf's own THEME defaults with this repo's palette and
# glyph vocabulary, so murmur state looks the same here as everywhere else.
set -g @mu_crew_c_crashed '#f38ba8'
set -g @mu_crew_c_blocked '#fab387'
set -g @mu_crew_c_done '#94e2d5'
set -g @mu_crew_c_working '#a6adc8'
set -g @mu_crew_c_waiting '#74c7ec'
set -g @mu_crew_c_idle '#6c7086'
set -g @mu_crew_g_crashed ''
set -g @mu_crew_g_blocked ''
set -g @mu_crew_g_done ''
set -g @mu_crew_g_working ''
set -g @mu_crew_g_waiting ''
set -g @mu_crew_g_idle ''
set -g @mu_crew_g_crew ''
set -g @mu_crew_g_agent '󰚩'
# THEME END: tmux-mu-crew-glyphs


# -----------------------------------------------------------------------------
# Environment and plugin bootstrap
# -----------------------------------------------------------------------------

# SSH agent passthrough.
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g 'SSH_AUTH_SOCK' $HOME/.ssh/ssh_auth_sock

# Initialize TPM (must be last).
run '$HOME/.tmux/plugins/tpm/tpm'
